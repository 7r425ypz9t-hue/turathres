<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024"><defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBE7A8"/><stop offset=".18" stop-color="#D9A441"/><stop offset=".42" stop-color="#8A5612"/>
      <stop offset=".6" stop-color="#F4D27E"/><stop offset=".82" stop-color="#A86C1C"/><stop offset="1" stop-color="#5E3608"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF4C8"/><stop offset=".35" stop-color="#F2CF77"/><stop offset=".65" stop-color="#C98E2A"/><stop offset="1" stop-color="#8E5A14"/>
    </linearGradient>
    <radialGradient id="dark" cx=".5" cy=".45" r=".7"><stop offset="0" stop-color="#5B3417"/><stop offset="1" stop-color="#21110A"/></radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B9732F"/><stop offset=".5" stop-color="#94531E"/><stop offset="1" stop-color="#5E3010"/></linearGradient>
    <linearGradient id="woodSide" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7A4116"/><stop offset="1" stop-color="#4A240A"/></linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8E5221"/><stop offset="1" stop-color="#C78845"/></linearGradient>
    <linearGradient id="arch" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E9D3A6"/><stop offset=".5" stop-color="#F8EBCB"/><stop offset="1" stop-color="#D2B47E"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".35" r=".55"><stop offset="0" stop-color="#FFE7B0" stop-opacity=".95"/><stop offset=".6" stop-color="#E9B866" stop-opacity=".45"/><stop offset="1" stop-color="#E9B866" stop-opacity="0"/></radialGradient>
    <radialGradient id="lamp" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFF6CF"/><stop offset=".5" stop-color="#FFC75A" stop-opacity=".8"/><stop offset="1" stop-color="#FF9E2C" stop-opacity="0"/></radialGradient>
    <radialGradient id="stud" cx=".35" cy=".3" r=".7"><stop offset="0" stop-color="#FFF0B8"/><stop offset=".5" stop-color="#C9922F"/><stop offset="1" stop-color="#6B4310"/></radialGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6A3B1C"/><stop offset=".55" stop-color="#3E200D"/><stop offset="1" stop-color="#2A1407"/></linearGradient>
    <radialGradient id="jewel" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#B9FFF6"/><stop offset=".45" stop-color="#1FA7A0"/><stop offset="1" stop-color="#0B4C4E"/></radialGradient>
    <radialGradient id="vignette" cx=".5" cy=".42" r=".7"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient>
    <radialGradient id="gloss" cx=".18" cy=".1" r=".45"><stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset=".4" stop-color="#fff" stop-opacity=".15"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>

    <!-- مشربية: نجمة ثمانية في شبكة خشبية فوق الفيروزي -->
    <pattern id="lattice" width="84" height="84" patternUnits="userSpaceOnUse">
      <rect width="84" height="84" fill="#0F5257"/>
      <rect width="84" height="84" fill="#0B3E43" opacity=".35"/>
      <g fill="none" stroke="#4A260C" stroke-width="10" stroke-linejoin="round">
        <polygon points="42,12 72,42 42,72 12,42"/><polygon points="20.8,20.8 63.2,20.8 63.2,63.2 20.8,63.2"/>
        <path d="M42 0V12M42 72V84M0 42H12M72 42H84M0 0L20.8 20.8M84 0L63.2 20.8M0 84L20.8 63.2M84 84L63.2 63.2"/>
      </g>
      <g fill="none" stroke="#B9783A" stroke-width="2" opacity=".6">
        <polygon points="42,12 72,42 42,72 12,42"/><polygon points="20.8,20.8 63.2,20.8 63.2,63.2 20.8,63.2"/>
      </g>
    </pattern>
    <pattern id="latticeDark" width="56" height="56" patternUnits="userSpaceOnUse">
      <rect width="56" height="56" fill="#3A1F0C"/>
      <g fill="none" stroke="#8C5A26" stroke-width="3"><polygon points="28,8 48,28 28,48 8,28"/><polygon points="14,14 42,14 42,42 14,42"/></g>
    </pattern>
    <!-- السجاد والمنسوجات -->
    <pattern id="carpet" width="60" height="30" patternUnits="userSpaceOnUse">
      <rect width="60" height="30" fill="#8C1C1A"/>
      <path d="M0 15 L15 3 L30 15 L15 27Z M30 15 L45 3 L60 15 L45 27Z" fill="#B53A2A"/>
      <path d="M8 15 L15 9 L22 15 L15 21Z M38 15 L45 9 L52 15 L45 21Z" fill="#F0D9A6"/>
      <path d="M13 15 L15 13 L17 15 L15 17Z M43 15 L45 13 L47 15 L45 17Z" fill="#2B1208"/>
    </pattern>
    <pattern id="textile" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(90)">
      <rect width="26" height="26" fill="#9A1E1E"/><rect y="0" width="26" height="5" fill="#2A1209"/><rect y="13" width="26" height="3" fill="#E8CF97"/>
      <path d="M0 9 L6.5 5 L13 9 L19.5 5 L26 9" stroke="#F1DDB0" stroke-width="2" fill="none"/>
    </pattern>
    <pattern id="textile2" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(90)">
      <rect width="24" height="24" fill="#E7D2A2"/><rect width="24" height="4" fill="#7D1D17"/><path d="M0 14 L6 9 L12 14 L18 9 L24 14" stroke="#2F1A0E" stroke-width="2.5" fill="none"/>
    </pattern>

    <clipPath id="panel"><rect x="78" y="78" width="868" height="868" rx="150"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".55"/></filter>
    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#1A0A02" flood-opacity=".85"/></filter>
  <clipPath id="sclip"><rect x="96" y="96" width="832" height="832" rx="150"/></clipPath></defs>
<rect x="24" y="24" width="976" height="976" rx="200" fill="url(#gold)"/>
<rect x="96" y="96" width="832" height="832" rx="150" fill="#0F5257"/>
<rect x="96" y="96" width="832" height="832" rx="150" fill="url(#lattice)" opacity=".9"/>
<path d="M512 170 C600 250 700 300 700 420 L700 600 L324 600 L324 420 C324 300 424 250 512 170Z" fill="#F3E2BE"/>
<rect x="250" y="470" width="524" height="190" rx="16" fill="url(#wood)" stroke="#4A240A" stroke-width="12"/>
<rect x="96" y="640" width="832" height="288" fill="url(#dark)" clip-path="url(#sclip)"/>
<rect x="96" y="96" width="832" height="832" rx="150" fill="none" stroke="#5E3608" stroke-width="16"/>
<text x="512" y="835" text-anchor="middle" direction="rtl" font-family="adwa-assalaf" font-weight="700" font-size="250" fill="url(#goldText)" stroke="#3A1F06" stroke-width="6">تراث</text>
</svg>