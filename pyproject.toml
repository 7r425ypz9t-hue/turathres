[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "turath"
version = "1.4.0"
description = "Turath (تراث) — Emirati Heritage Studies & Research Department: archive, oral-history lab, evidence triangulation, quality gates"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
docx = ["python-docx>=1.1"]
asr = ["faster-whisper"]

[project.scripts]
turath = "turath.cli:main"

[tool.setuptools.packages.find]
include = ["turath*"]

[tool.setuptools.package-data]
"turath" = ["static/*", "static/img/*", "static/img/photos/*", "data/*.json", "data/agents/*.json"]
