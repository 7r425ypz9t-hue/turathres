name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install python-docx
      - run: python -m unittest discover -s tests -v
      - name: docs are in sync with code
        run: |
          python -m turath docs-gen
          git diff --exit-code docs/03-database-schema.md docs/17-agent-cards.md docs/18-skills.md .claude/skills
